{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change my password</h1></div></div>
<form class="card" method="post" style="max-width:480px">
  {{ csrf() }}
  <p><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></p>
  <p><label>New password</label><input type="password" name="new" required minlength="6" autocomplete="new-password">
    <span class="field-help">At least 6 characters.</span></p>
  <p><label>Type the new password again</label><input type="password" name="confirm" required minlength="6" autocomplete="new-password"></p>
  <button class="btn">Change password</button>
</form>
{% endblock %}
