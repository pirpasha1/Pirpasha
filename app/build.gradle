plugins {
    id 'com.android.application'
}

android {
    namespace 'com.localguard.autoreply'
    compileSdk 34

    defaultConfig {
        applicationId 'com.localguard.autoreply'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Deliberately NO dependencies: nothing third-party, nothing that can phone home.
dependencies {
}
