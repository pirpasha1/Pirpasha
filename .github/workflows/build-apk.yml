name: Build APK

# Free cloud build on GitHub. Push this project to a GitHub repo (private is fine),
# open the Actions tab, run "Build APK", then download the "CallGuardLocal-debug-apk" artifact.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run privacy-guard tests and backtest (plain JVM)
        run: bash tests/run_tests.sh

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CallGuardLocal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
