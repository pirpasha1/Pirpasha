name: PMP prep app – build & test

on:
  push:
    paths: ["pmp_prep_app/**", ".github/workflows/pmp-android.yml"]
  pull_request:
    paths: ["pmp_prep_app/**", ".github/workflows/pmp-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmp_prep_app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild content bundle and check it is up to date
        working-directory: pmp_prep_app/content
        run: |
          python3 build_content.py
          git diff --exit-code -- ../android/app/src/main/assets/content.json
      - name: Engine + content tests
        run: ./gradlew :engine:test
      - name: App end-to-end tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: openpm-prep-apks
          path: |
            pmp_prep_app/android/app/build/outputs/apk/debug/*.apk
            pmp_prep_app/android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-screenshots
          path: |
            pmp_prep_app/android/**/build/reports/tests/
            pmp_prep_app/android/app/build/screenshots/
